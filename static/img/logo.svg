<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Degradado del escudo (OSS Guard) -->
    <linearGradient id="shieldGrad" x1="20" y1="10" x2="100" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#142345"/>
      <stop offset="1" stop-color="#3867ed"/>
    </linearGradient>
    
    <!-- Halo del nodo de riesgo (Predicción ML) -->
    <radialGradient id="riskGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5a68" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff5a68" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. Escudo base (Seguridad / Guardia) -->
  <path d="M60 6 L105 24 V58 C105 84 80 104 60 114 C40 104 15 84 15 58 V24 L60 6Z" fill="url(#shieldGrad)" stroke="#7da5ff" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- 2. Grafo de dependencias OSS (Líneas y nodos blancos) -->
  <g stroke="#ffffff" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round">
    <line x1="60" y1="40" x2="35" y2="60"/>
    <line x1="60" y1="40" x2="80" y2="60"/>
    <line x1="35" y1="60" x2="50" y2="85"/>
    <line x1="80" y1="60" x2="50" y2="85"/>
    <line x1="60" y1="40" x2="60" y2="65"/>
  </g>

  <g fill="#ffffff">
    <circle cx="60" cy="40" r="5"/> <!-- Nodo raíz -->
    <circle cx="35" cy="60" r="4.5"/>
    <circle cx="50" cy="85" r="4.5"/>
    <circle cx="60" cy="65" r="4"/>
  </g>

  <!-- 3. Módulo de Machine Learning (Radar más pequeño y contenido) -->
  <!-- Círculos concéntricos punteados reducidos -->
  <circle cx="80" cy="60" r="13" fill="none" stroke="#7da5ff" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6"/>
  <circle cx="80" cy="60" r="19" fill="none" stroke="#7da5ff" stroke-width="1" stroke-dasharray="2 4" opacity="0.3"/>
  
  <!-- Cruz de escáner acortada -->
  <line x1="80" y1="38" x2="80" y2="43" stroke="#7da5ff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="80" y1="77" x2="80" y2="82" stroke="#7da5ff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="58" y1="60" x2="63" y2="60" stroke="#7da5ff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="97" y1="60" x2="102" y2="60" stroke="#7da5ff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- 4. Nodo de Riesgo (Resultado del modelo) -->
  <circle cx="80" cy="60" r="10" fill="url(#riskGlow)"/>
  <circle cx="80" cy="60" r="5.5" fill="#ff5a68"/>
</svg>
